version: 1

catalog:
  id: citora_analytics_metrics
  name: Citora Analytics Metrics
  description: Единый каталог бизнес-метрик для отчетности и AI-аналитика.

  dataset:
    database: CITORA
    schema: ANALYTICS
    table: FCT_APPLICATION_SALES
    grain: Одна связка заявки и продажи, включая несвязанные заявки и продажи.

  reporting_period:
    start_inclusive: true
    end_inclusive: true
    timezone: Europe/Berlin

metrics:
  - id: leads
    name: Лиды
    description: >-
      Количество уникальных номеров телефона среди заявок, созданных в
      выбранном отчетном периоде.
    type: count_distinct
    expression: phone_number
    time_dimension: application_created_at
    additivity: non_additive
    dimensions:
      - final_source
      - final_segment
      - manager
    filters:
      - application_id is not null
    business_rules:
      - Повторные заявки с одним номером телефона считаются одним лидом.
      - Пустой исходный номер нормализован в строку 0 и считается одним лидом.
      - Продажи без заявки не участвуют в расчете.
      - >-
        При группировке по источнику, сегменту или менеджеру уникальные телефоны
        считаются отдельно внутри каждой группы.
      - >-
        Один телефон может относиться к нескольким источникам, сегментам или
        менеджерам, поэтому сумма лидов по группам может не равняться общему
        числу лидов.
    sql_template: >-
      COUNT(DISTINCT CASE
        WHEN application_id IS NOT NULL THEN phone_number
      END)

  - id: sales_count
    name: Количество продаж
    description: Количество продаж с датой оплаты в выбранном отчетном периоде.
    type: count
    expression: sale_id
    time_dimension: paid_at
    additivity: additive
    dimensions:
      - final_source
      - final_segment
      - manager
    filters:
      - sale_id is not null
    business_rules:
      - Каждая продажа представлена одной строкой и считается один раз.
      - Продажи без заявки включаются в расчет с менеджером Самоток.
      - >-
        Сумма количества продаж по источникам, сегментам или менеджерам равна
        общему количеству продаж при использовании одинаковых фильтров.
    sql_template: COUNT(CASE WHEN sale_id IS NOT NULL THEN 1 END)

  - id: applications_count
    name: Количество заявок
    description: Количество заявок, созданных в выбранном отчетном периоде.
    type: sum
    expression: is_unique
    time_dimension: application_created_at
    additivity: additive
    dimensions:
      - final_source
      - final_segment
      - manager
    filters:
      - application_id is not null
      - match_type != 'sale_without_application'
      - manager != 'Самоток'
    business_rules:
      - >-
        Поле is_unique равно 1 ровно у одной отчетной строки каждой заявки,
        поэтому заявка с несколькими продажами считается один раз.
      - Заявка без продажи учитывается в расчете.
      - Продажи Самотока без заявки не учитываются.
      - >-
        Сумма количества заявок по источникам, сегментам или менеджерам равна
        общему количеству заявок при использовании одинаковых фильтров.
    sql_template: >-
      SUM(CASE
        WHEN application_id IS NOT NULL
          AND match_type != 'sale_without_application'
          AND manager != 'Самоток'
        THEN is_unique
        ELSE 0
      END)
