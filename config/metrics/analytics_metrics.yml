version: 1

catalog:
  id: citora_analytics_metrics
  name: Citora Analytics Metrics
  description: Единый каталог бизнес-метрик для отчетности и AI-аналитика.

  dataset:
    database: CITORA
    schema: ANALYTICS
    table: FCT_APPLICATION_SALES
    grain: Одна связка заявки и продажи, включая несвязанные заявки и продажи.

  reporting_period:
    start_inclusive: true
    end_inclusive: true
    timezone: Europe/Berlin

metrics:
  - id: leads
    name: Лиды
    description: >-
      Количество уникальных номеров телефона среди заявок, созданных в
      выбранном отчетном периоде.
    type: count_distinct
    expression: phone_number
    time_dimension: application_created_at
    additivity: non_additive
    dimensions:
      - final_source
      - final_segment
      - manager
    filters:
      - application_id is not null
    business_rules:
      - Повторные заявки с одним номером телефона считаются одним лидом.
      - Пустой исходный номер нормализован в строку 0 и считается одним лидом.
      - Продажи без заявки не участвуют в расчете.
      - >-
        При группировке по источнику, сегменту или менеджеру уникальные телефоны
        считаются отдельно внутри каждой группы.
      - >-
        Один телефон может относиться к нескольким источникам, сегментам или
        менеджерам, поэтому сумма лидов по группам может не равняться общему
        числу лидов.
    sql_template: >-
      COUNT(DISTINCT CASE
        WHEN application_id IS NOT NULL THEN phone_number
      END)

  - id: sales_count
    name: Количество продаж
    description: Количество продаж с датой оплаты в выбранном отчетном периоде.
    type: count
    expression: sale_id
    time_dimension: paid_at
    additivity: additive
    dimensions:
      - final_source
      - final_segment
      - manager
    filters:
      - sale_id is not null
    business_rules:
      - Каждая продажа представлена одной строкой и считается один раз.
      - Продажи без заявки включаются в расчет с менеджером Самоток.
      - >-
        Сумма количества продаж по источникам, сегментам или менеджерам равна
        общему количеству продаж при использовании одинаковых фильтров.
    sql_template: COUNT(CASE WHEN sale_id IS NOT NULL THEN 1 END)

  - id: applications_count
    name: Количество заявок
    description: Количество заявок, созданных в выбранном отчетном периоде.
    type: sum
    expression: is_unique
    time_dimension: application_created_at
    additivity: additive
    dimensions:
      - final_source
      - final_segment
      - manager
    filters:
      - application_id is not null
      - match_type != 'sale_without_application'
      - manager != 'Самоток'
    business_rules:
      - >-
        Поле is_unique равно 1 ровно у одной отчетной строки каждой заявки,
        поэтому заявка с несколькими продажами считается один раз.
      - Заявка без продажи учитывается в расчете.
      - Продажи Самотока без заявки не учитываются.
      - >-
        Сумма количества заявок по источникам, сегментам или менеджерам равна
        общему количеству заявок при использовании одинаковых фильтров.
    sql_template: >-
      SUM(CASE
        WHEN application_id IS NOT NULL
          AND match_type != 'sale_without_application'
          AND manager != 'Самоток'
        THEN is_unique
        ELSE 0
      END)

  - id: application_to_sale_conversion
    name: Конверсия заявок в продажи
    description: >-
      Отношение количества продаж, привязанных к заявкам отчетного периода,
      к количеству заявок, созданных в этом периоде.
    type: ratio
    format: percent
    time_dimension: application_created_at
    additivity: non_additive
    conversion_window:
      parameter: conversion_period_days
      default_days: 30
    dimensions:
      - final_source
      - final_segment
      - manager
    filters:
      - application_id is not null
      - match_type != 'sale_without_application'
      - manager != 'Самоток'
    numerator:
      name: Продажи по заявкам периода
      expression: sale_id
      aggregation: count
      sql_template: >-
        COUNT(CASE
          WHEN application_id IS NOT NULL
            AND sale_id IS NOT NULL
            AND manager != 'Самоток'
          THEN 1
        END)
    denominator:
      name: Заявки периода
      expression: is_unique
      aggregation: sum
      sql_template: >-
        SUM(CASE
          WHEN application_id IS NOT NULL
            AND manager != 'Самоток'
          THEN is_unique
          ELSE 0
        END)
    business_rules:
      - Отчетный период фильтруется по дате создания заявки.
      - >-
        Дата продажи может быть позже конца отчетного периода, если продажа
        попала в настроенное окно конверсии после заявки.
      - >-
        Значение за прошедший период может увеличиваться по мере появления
        продаж в течение окна конверсии.
      - Продажи Самотока без заявки не участвуют в расчете.
      - Метрика является отношением и не суммируется между группами.
      - Значение 0.25 отображается как 25 процентов.
    sql_template: >-
      DIV0(
        COUNT(CASE
          WHEN application_id IS NOT NULL
            AND sale_id IS NOT NULL
            AND manager != 'Самоток'
          THEN 1
        END),
        SUM(CASE
          WHEN application_id IS NOT NULL
            AND manager != 'Самоток'
          THEN is_unique
          ELSE 0
        END)
      )

  - id: self_flow_sales_share
    name: Доля самотока в продажах
    description: Доля продаж без связанной заявки среди всех продаж периода.
    type: ratio
    format: percent
    time_dimension: paid_at
    additivity: non_additive
    dimensions:
      - final_source
      - final_segment
    filters:
      - sale_id is not null
    numerator:
      name: Продажи из самотока
      expression: sale_id
      aggregation: count
      filters:
        - match_type = 'sale_without_application'
        - manager = 'Самоток'
      sql_template: >-
        COUNT(CASE
          WHEN sale_id IS NOT NULL
            AND match_type = 'sale_without_application'
            AND manager = 'Самоток'
          THEN 1
        END)
    denominator:
      name: Все продажи
      expression: sale_id
      aggregation: count
      sql_template: COUNT(CASE WHEN sale_id IS NOT NULL THEN 1 END)
    business_rules:
      - Отчетный период фильтруется по дате оплаты.
      - Самотоком считается продажа без связанной заявки.
      - Значение 0.25 отображается как 25 процентов.
      - Метрика является отношением и не суммируется между группами.
    sql_template: >-
      DIV0(
        COUNT(CASE
          WHEN sale_id IS NOT NULL
            AND match_type = 'sale_without_application'
            AND manager = 'Самоток'
          THEN 1
        END),
        COUNT(CASE WHEN sale_id IS NOT NULL THEN 1 END)
      )

  - id: average_conversion_time
    name: Среднее время конверсии
    description: >-
      Среднее количество дней между созданием заявки и первой продажей,
      связанной с этой заявкой в пределах настроенного окна конверсии.
    type: average
    format: decimal_days
    expression: conversion_period_days
    time_dimension: application_created_at
    additivity: non_additive
    conversion_window:
      parameter: conversion_period_days
      default_days: 30
    dimensions:
      - final_source
      - final_segment
      - manager
    filters:
      - application_id is not null
      - sale_id is not null
      - match_type = 'matched'
      - is_unique = 1
      - manager != 'Самоток'
    business_rules:
      - Отчетный период фильтруется по дате создания заявки.
      - Для каждой реализованной заявки учитывается только первая продажа.
      - Нереализованные заявки не участвуют в расчете.
      - Продажи Самотока без заявки не участвуют в расчете.
      - >-
        Продажи за пределами conversion_period_days не связываются с заявкой
        аналитическим слоем и поэтому не участвуют в расчете.
      - >-
        Значение за прошедший период может изменяться по мере появления первых
        продаж в течение настроенного окна конверсии.
      - Метрика измеряется в календарных днях и не суммируется между группами.
    sql_template: >-
      AVG(CASE
        WHEN application_id IS NOT NULL
          AND sale_id IS NOT NULL
          AND match_type = 'matched'
          AND is_unique = 1
          AND manager != 'Самоток'
        THEN conversion_period_days
      END)

  - id: marked_applications_share
    name: Доля размеченных заявок
    description: >-
      Доля заявок, у которых заполнен итоговый сегмент и/или итоговый источник,
      среди всех заявок отчетного периода.
    type: ratio
    format: percent
    time_dimension: application_created_at
    additivity: non_additive
    dimensions:
      - final_source
      - final_segment
      - manager
    filters:
      - application_id is not null
      - match_type != 'sale_without_application'
      - manager != 'Самоток'
    numerator:
      name: Размеченные заявки
      expression: is_unique
      aggregation: sum
      filters:
        - final_segment != 'Без разметки' or final_source != 'Без разметки'
      sql_template: >-
        SUM(CASE
          WHEN application_id IS NOT NULL
            AND manager != 'Самоток'
            AND is_unique = 1
            AND (
              final_segment != 'Без разметки'
              OR final_source != 'Без разметки'
            )
          THEN 1
          ELSE 0
        END)
    denominator:
      name: Все заявки
      expression: is_unique
      aggregation: sum
      sql_template: >-
        SUM(CASE
          WHEN application_id IS NOT NULL
            AND manager != 'Самоток'
          THEN is_unique
          ELSE 0
        END)
    business_rules:
      - Отчетный период фильтруется по дате создания заявки.
      - Каждая заявка учитывается один раз через признак is_unique.
      - >-
        Заявка считается размеченной, если хотя бы одно из полей final_segment
        или final_source отличается от значения Без разметки.
      - Значение Прочее считается разметкой.
      - Продажи Самотока без заявки не участвуют в расчете.
      - Значение 0.25 отображается как 25 процентов.
      - Метрика является отношением и не суммируется между группами.
    sql_template: >-
      DIV0(
        SUM(CASE
          WHEN application_id IS NOT NULL
            AND manager != 'Самоток'
            AND is_unique = 1
            AND (
              final_segment != 'Без разметки'
              OR final_source != 'Без разметки'
            )
          THEN 1
          ELSE 0
        END),
        SUM(CASE
          WHEN application_id IS NOT NULL
            AND manager != 'Самоток'
          THEN is_unique
          ELSE 0
        END)
      )
