name: CITORA_ANALYTICS_SEMANTIC_VIEW
description: Семантический слой Citora для анализа заявок, продаж и конверсии.

tables:
  - name: APPLICATION_SALES
    synonyms:
      - воронка заявок и продаж
      - application sales funnel
    description: >-
      Отчетные события с единой датой периода: одна строка APPLICATION на
      заявку и одна строка SALE на продажу.
    base_table:
      database: CITORA
      schema: ANALYTICS
      table: V_REPORTING_METRICS_ENRICHED
    primary_key:
      columns:
        - DICTIONARY_ID
        - REPORTING_EVENT_ID

    dimensions:
      - name: DICTIONARY_ID
        synonyms:
          - справочник
          - dictionary
        description: Идентификатор пользовательского справочника, обязательный для фильтрации.
        expr: DICTIONARY_ID
        data_type: VARCHAR

      - name: OWNER_EMAIL
        synonyms:
          - владелец справочника
        description: E-mail владельца пользовательского справочника.
        expr: OWNER_EMAIL
        data_type: VARCHAR

      - name: DICTIONARY_NAME
        synonyms:
          - название справочника
        description: Название справочника, уникальное в рамках владельца.
        expr: DICTIONARY_NAME
        data_type: VARCHAR

      - name: DICTIONARY_CREATED_BY
        synonyms:
          - автор справочника
          - кто создал справочник
        description: E-mail пользователя, который создал или импортировал справочник.
        expr: CREATED_BY
        data_type: VARCHAR

      - name: RECORD_TYPE
        synonyms:
          - тип события
        description: APPLICATION для заявки или SALE для продажи.
        expr: RECORD_TYPE
        data_type: VARCHAR
        is_enum: true
        sample_values:
          - APPLICATION
          - SALE

      - name: FINAL_SOURCE
        synonyms:
          - источник
          - source
        description: Итоговый источник заявки или продажи.
        expr: FINAL_SOURCE
        data_type: VARCHAR

      - name: FINAL_SEGMENT
        synonyms:
          - сегмент
          - segment
        description: Итоговый клиентский или маркетинговый сегмент.
        expr: FINAL_SEGMENT
        data_type: VARCHAR

      - name: MANAGER
        synonyms:
          - менеджер
          - ответственный
        description: Менеджер после применения выбранного справочника.
        expr: MANAGER
        data_type: VARCHAR

      - name: MATCH_TYPE
        synonyms:
          - тип связи
        description: Тип связи заявки и продажи.
        expr: MATCH_TYPE
        data_type: VARCHAR
        is_enum: true
        sample_values:
          - matched
          - application_without_sale
          - sale_without_application

      - name: FUNNEL
        synonyms:
          - воронка
        description: Воронка исходной заявки.
        expr: FUNNEL
        data_type: VARCHAR

      - name: PRODUCT
        synonyms:
          - продукт
        description: Продукт продажи.
        expr: PRODUCT
        data_type: VARCHAR

    time_dimensions:
      - name: REPORT_DATE
        synonyms:
          - отчетная дата
          - дата отчета
        description: >-
          Единая дата фильтрации отчетного периода в Europe/Berlin: дата
          создания для APPLICATION и дата оплаты для SALE.
        expr: REPORT_DATE
        data_type: TIMESTAMP_NTZ

    facts:
      - name: AMOUNT
        description: Сумма продажи.
        expr: AMOUNT
        data_type: NUMBER(38,2)

      - name: CONVERSION_PERIOD_DAYS
        description: Число дней от заявки до связанной продажи.
        expr: CONVERSION_PERIOD_DAYS
        data_type: FLOAT

      - name: MATCHED_SALES_COUNT
        description: Количество продаж, связанных с заявкой периода.
        expr: MATCHED_SALES_COUNT
        data_type: NUMBER
        access_modifier: private_access

    metrics:
      - name: LEADS
        synonyms:
          - лиды
          - количество лидов
        description: >-
          Уникальные номера телефона среди заявок периода. Значение 0 считается
          одним лидом. Метрика неаддитивна по источникам, сегментам и менеджерам.
        expr: >-
          COUNT(DISTINCT CASE
            WHEN RECORD_TYPE = 'APPLICATION' THEN PHONE_NUMBER
          END)

      - name: SALES_COUNT
        synonyms:
          - продажи
          - количество продаж
        description: Количество событий продаж по единой отчетной дате.
        expr: COUNT(CASE WHEN RECORD_TYPE = 'SALE' THEN 1 END)

      - name: APPLICATIONS_COUNT
        synonyms:
          - заявки
          - количество заявок
        description: >-
          Количество событий заявок по единой отчетной дате. Самоток не
          учитывается. Аддитивная метрика.
        expr: >-
          SUM(CASE
            WHEN RECORD_TYPE = 'APPLICATION'
            THEN 1
            ELSE 0
          END)

      - name: APPLICATION_TO_SALE_CONVERSION
        synonyms:
          - конверсия
          - конверсия заявок в продажи
        description: >-
          Продажи, связанные с заявками периода, деленные на заявки периода.
          Период задается датой заявки; продажи могут добегать в пределах окна
          конверсии аналитического слоя. Самоток не учитывается.
        expr: >-
          DIV0(
            SUM(CASE
              WHEN RECORD_TYPE = 'APPLICATION'
              THEN MATCHED_SALES_COUNT
              ELSE 0
            END),
            SUM(CASE
              WHEN RECORD_TYPE = 'APPLICATION'
              THEN 1
              ELSE 0
            END)
          )

      - name: SELF_FLOW_SALES_SHARE
        synonyms:
          - доля самотока
          - доля самотока в продажах
        description: >-
          Продажи без связанной заявки, деленные на все продажи по дате оплаты.
        expr: >-
          DIV0(
            COUNT(CASE
              WHEN RECORD_TYPE = 'SALE'
                AND MATCH_TYPE = 'sale_without_application'
              THEN 1
            END),
            COUNT(CASE WHEN RECORD_TYPE = 'SALE' THEN 1 END)
          )

      - name: AVERAGE_CONVERSION_TIME
        synonyms:
          - среднее время конверсии
          - средний период конверсии
        description: >-
          Среднее число дней от заявки до первой связанной продажи в пределах
          окна конверсии. Нереализованные заявки и Самоток не учитываются.
        expr: >-
          AVG(CASE
            WHEN RECORD_TYPE = 'APPLICATION'
              AND MATCH_TYPE = 'matched'
            THEN CONVERSION_PERIOD_DAYS
          END)

      - name: MARKED_APPLICATIONS_SHARE
        synonyms:
          - доля размеченных заявок
          - разметка заявок
        description: >-
          Доля заявок, у которых источник и/или сегмент отличается от значения
          Без разметки. Значение Прочее считается разметкой. Самоток исключен.
        expr: >-
          DIV0(
            SUM(CASE
              WHEN RECORD_TYPE = 'APPLICATION'
                AND (
                  FINAL_SEGMENT != 'Без разметки'
                  OR FINAL_SOURCE != 'Без разметки'
                )
              THEN 1
              ELSE 0
            END),
            SUM(CASE
              WHEN RECORD_TYPE = 'APPLICATION'
              THEN 1
              ELSE 0
            END)
          )

module_custom_instructions:
  sql_generation: |
    Interpret all reporting dates in the Europe/Berlin time zone.
    Always filter by DICTIONARY_ID when it is supplied in the user context.
    Never combine rows from different DICTIONARY_ID values in one calculation.
    Always filter every requested metric by REPORT_DATE when the user specifies
    a reporting period. REPORT_DATE already represents APPLICATION_CREATED_AT
    for application metrics and PAID_AT for sales metrics. A single REPORT_DATE
    filter is therefore correct for mixed metric requests. Ratios are stored as
    fractions: format 0.25 as 25% for users.
    Do not sum non-additive metrics across sources, segments, managers, or time.
    For conversion metrics, include sales that occurred after the reporting
    period when they are already linked to an application by the analytical
    layer's configured conversion window.
  question_categorization: |
    If a request gives a period, use REPORT_DATE unless the user explicitly
    requests a different technical date.
