name: citora_analytics
version: 1.0.0
config-version: 2

profile: citora_analytics

model-paths: ["models"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages", "logs"]

vars:
  recalculation_date_from: ""
  recalculation_date_to: ""
  conversion_period_days: 30
  other_manager_label: Прочее
  self_flow_manager_label: Самоток
  other_attribution_label: Прочее
  empty_attribution_label: Без разметки

models:
  citora_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: analytics

seeds:
  citora_analytics:
    +schema: config
    +quote_columns: false
    utm_source_mapping:
      +column_types:
        priority: integer
    utm_content_mapping:
      +column_types:
        priority: integer
    promocode_mapping:
      +column_types:
        priority: integer
