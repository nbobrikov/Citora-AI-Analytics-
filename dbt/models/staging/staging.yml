version: 2

models:
  - name: stg_crm_deals
    description: >-
      Накопленный набор CRM-сделок из всех успешных загрузок. Для каждого
      deal_id сохраняется самая свежая версия, после чего применяются
      эталонные имена, типы и нормализация текстовых полей.
    columns:
      - name: deal_id
        description: Уникальный идентификатор исходной сделки.
        data_tests:
          - not_null
          - unique
      - name: funnel
        data_tests:
          - not_null
      - name: contact_id
        description: SHA-256 исходного Contact ID; SHA-256 значения 0 означает отсутствие значения.
        description: Идентификатор контакта; 0 означает отсутствие значения в источнике.
        data_tests:
          - not_null
      - name: phone_number
        description: SHA-256 номера телефона; SHA-256 значения 0 означает отсутствие значения в источнике.
        data_tests:
          - not_null
      - name: manager
        data_tests:
          - not_null
      - name: created_at
        data_tests:
          - not_null
      - name: load_id
        data_tests:
          - not_null
      - name: source_row_number
        data_tests:
          - not_null

  - name: int_crm_deals_prepared
    description: >-
      Эквивалент результата prepare_df_for_converstion: очищенные данные,
      по умолчанию за весь накопленный период. Необязательные переменные
      recalculation_date_from и recalculation_date_to ограничивают пересчёт;
      вокруг диапазона сохраняется запас на окно конверсии.
    columns:
      - name: deal_id
        data_tests:
          - not_null
          - unique
      - name: created_at
        data_tests:
          - not_null

  - name: int_crm_applications
    description: >-
      Все заявки из разрешённых воронок. Повторяет getZayavkiDF с параметрами
      unique=False и Samotok=False. Менеджер, источник, сегмент и промокод
      сохраняются в исходном виде; справочник применяется только при отчёте.
    columns:
      - name: application_id
        data_tests:
          - not_null
          - unique
      - name: application_manager
        description: Менеджер заявки в исходных данных.
      - name: application_source
        description: Исходный utm_source заявки.
      - name: application_segment
        description: Исходный utm_content заявки.
      - name: application_promo
        description: Промокод заявки.
      - name: application_created_at
        data_tests:
          - not_null
      - name: phone_number
        data_tests:
          - not_null
      - name: application_sequence_number
        data_tests:
          - not_null

  - name: int_crm_sales
    description: >-
      Все продажи из разрешённых воронок с датой оплаты, заполненным продуктом
      и положительной суммой. Повторяет getSalesDF без отменённого ограничения
      только на первую продажу клиента.
    columns:
      - name: sale_id
        data_tests:
          - not_null
          - unique
      - name: paid_at
        data_tests:
          - not_null
      - name: amount
        data_tests:
          - not_null
      - name: product
        data_tests:
          - not_null
      - name: sale_manager
        description: Менеджер продажи в исходных данных.
      - name: sale_promo
        description: Промокод продажи.
      - name: load_id
        data_tests:
          - not_null

  - name: int_application_sales_matches
    description: >-
      Связывает каждую продажу с самой ранней подходящей заявкой того же
      телефона в пределах conversion_period_days. Содержит также заявки без
      продаж и продажи Самотока без заявок.
    columns:
      - name: sale_id
        data_tests:
          - unique
      - name: match_type
        data_tests:
          - not_null
          - accepted_values:
              values:
                - matched
                - application_without_sale
                - sale_without_application
      - name: is_unique
        data_tests:
          - not_null
          - accepted_values:
              values: [0, 1]

  - name: int_application_sales_enriched
    description: >-
      Итоговая связка заявок и продаж с исходными значениями обеих сторон.
      Справочники намеренно не применяются в dbt-слое.
    columns:
      - name: match_type
        data_tests:
          - not_null
      - name: final_segment
        description: Исходный utm_content продажи или заявки.
      - name: final_source
        description: Исходный utm_source продажи или заявки.
