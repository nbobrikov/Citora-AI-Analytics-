version: 2

models:
  - name: fct_application_sales
    description: >-
      Финальная физическая отчетная таблица со связками заявок и продаж.
      Зерно таблицы — одна связка заявки и продажи; несвязанные заявки и
      продажи также представлены отдельными строками.
    columns:
      - name: reporting_row_id
        description: Стабильный технический идентификатор отчетной строки.
        data_tests:
          - not_null
          - unique
      - name: match_type
        description: Тип связи заявки и продажи.
        data_tests:
          - not_null
          - accepted_values:
              values:
                - matched
                - application_without_sale
                - sale_without_application
      - name: is_unique
        description: Признак первой продажи, связанной с заявкой.
        data_tests:
          - not_null
          - accepted_values:
              values: [0, 1]
      - name: final_segment
        description: Исходный utm_content, ещё не обработанный справочником.
      - name: final_source
        description: Исходный utm_source, ещё не обработанный справочником.
      - name: application_promo
        description: Промокод заявки.
      - name: sale_promo
        description: Промокод продажи.
      - name: dbt_built_at
        description: Время построения физической отчетной таблицы.
        data_tests:
          - not_null

  - name: fct_reporting_metrics
    description: >-
      Отчетный слой с единой датой REPORT_DATE. Каждая заявка представлена
      одной записью APPLICATION с датой создания, а каждая продажа — одной
      записью SALE с датой оплаты.
    columns:
      - name: reporting_event_id
        description: Стабильный идентификатор события заявки или продажи.
        data_tests:
          - not_null
          - unique
      - name: record_type
        description: Тип отчетного события.
        data_tests:
          - not_null
          - accepted_values:
              values: [APPLICATION, SALE]
      - name: report_date
        description: Единая дата применения фильтра отчетного периода.
        data_tests:
          - not_null
      - name: matched_sales_count
        description: >-
          Количество продаж, связанных с заявкой; заполнено для события
          APPLICATION и используется в расчете конверсии.
        data_tests:
          - not_null
