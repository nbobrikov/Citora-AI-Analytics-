[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "citora-ai-analytic"
version = "0.1.0"
description = "Excel-to-Snowflake analytics pipeline and AI analyst for Citora."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "pydantic>=2.10,<3",
  "pyyaml>=6.0,<7",
  "snowflake-snowpark-python>=1.27,<2",
]

[project.optional-dependencies]
dbt = [
  "dbt-snowflake>=1.9,<2",
]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
citora-load = "citora_ai_analytic.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/citora_ai_analytic"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
